<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="860" viewBox="0 0 1280 860" font-family="Segoe UI, DejaVu Sans, sans-serif">
  <!-- STATE S4 v2: quick look overlay, FIDELITY mode (folder detected an upscale batch with a source image) -->

  <!-- window shell -->
  <rect x="20" y="16" width="1240" height="812" rx="12" fill="#2b2b2b" stroke="#4a4a4a"/>
  <rect x="21" y="17" width="1238" height="40" rx="11" fill="#333333"/>
  <text x="44" y="42" font-size="13" fill="#dfdfdf">Improve ImgSLI — Image Gallery</text>
  <circle cx="1196" cy="37" r="7" fill="#3a3a3a" stroke="#5a5a5a"/>
  <circle cx="1170" cy="37" r="7" fill="#3a3a3a" stroke="#5a5a5a"/>
  <circle cx="1144" cy="37" r="7" fill="#c0392b"/>

  <!-- dimmed background grid -->
  <g opacity="0.35">
    <rect x="44" y="72" width="132" height="34" rx="8" fill="#3a3a3a"/>
    <rect x="44" y="114" width="1192" height="34" rx="8" fill="#333333"/>
    <g fill="#333333" stroke="#FFFFFF" stroke-opacity="0.06">
      <rect x="44" y="192" width="250" height="170" rx="10"/>
      <rect x="318" y="192" width="250" height="170" rx="10"/>
      <rect x="592" y="192" width="250" height="170" rx="10"/>
      <rect x="866" y="192" width="250" height="170" rx="10"/>
      <rect x="44" y="408" width="250" height="170" rx="10"/>
      <rect x="318" y="408" width="250" height="170" rx="10"/>
      <rect x="44" y="634" width="250" height="170" rx="10"/>
    </g>
  </g>
  <rect x="21" y="58" width="1238" height="768" rx="11" fill="#000000" fill-opacity="0.45"/>

  <!-- quick look panel -->
  <g>
    <rect x="120" y="100" width="1040" height="620" rx="12" fill="#303030" stroke="#555555" stroke-width="1.5"/>

    <!-- mode chip -->
    <rect x="144" y="116" width="118" height="20" rx="10" fill="#0096FF" fill-opacity="0.2"/>
    <text x="154" y="130" font-size="10" letter-spacing="1" fill="#7fc4ff">FIDELITY MODE</text>

    <!-- large preview -->
    <clipPath id="qp"><rect x="144" y="148" width="640" height="456" rx="10"/></clipPath>
    <g clip-path="url(#qp)">
      <rect x="144" y="148" width="640" height="456" fill="#6f5436"/>
      <circle cx="464" cy="340" r="60" fill="#e9b958"/>
      <rect x="144" y="436" width="640" height="84" fill="#453a2a"/>
      <path d="M144 436 l90 -32 70 22 105 -42 130 34 145 -24 v210 h-640 z" fill="#57452e"/>
      <!-- sky gradient with faint banding stripes (what banding score flags) -->
      <g stroke="#FFFFFF" stroke-opacity="0.05">
        <line x1="144" y1="170" x2="784" y2="170"/>
        <line x1="144" y1="190" x2="784" y2="190"/>
        <line x1="144" y1="210" x2="784" y2="210"/>
        <line x1="144" y1="230" x2="784" y2="230"/>
      </g>
    </g>

    <!-- source inset: bottom-left corner of preview -->
    <g>
      <clipPath id="src"><rect x="156" y="508" width="150" height="84" rx="6"/></clipPath>
      <g clip-path="url(#src)">
        <rect x="156" y="508" width="150" height="84" fill="#5c4630"/>
        <circle cx="231" cy="548" r="14" fill="#c09448"/>
        <rect x="156" y="562" width="150" height="30" fill="#3f3322"/>
      </g>
      <rect x="156" y="508" width="150" height="84" fill="none" stroke="#e8b64c" stroke-width="1.5"/>
      <rect x="156" y="508" width="150" height="16" fill="#000000" fill-opacity="0.55"/>
      <text x="160" y="519" font-size="9" fill="#e8b64c">SOURCE · sunset_042.jpg · 960×540</text>
    </g>

    <!-- prev / next in series -->
    <circle cx="126" cy="370" r="18" fill="#2b2b2b" stroke="#FFFFFF" stroke-opacity="0.25"/>
    <path d="M131 362 l-9 8 9 8" stroke="#dfdfdf" stroke-width="2" fill="none"/>
    <circle cx="802" cy="370" r="18" fill="#2b2b2b" stroke="#FFFFFF" stroke-opacity="0.25"/>
    <path d="M797 362 l9 8 -9 8" stroke="#dfdfdf" stroke-width="2" fill="none"/>
    <text x="144" y="628" font-size="12" fill="#dfdfdf">sunset_042_up6.png</text>
    <text x="330" y="628" font-size="11" fill="#8f8f8f">3840 × 2160 · PNG · 12.4 MB · upscale ×4 from source</text>

    <!-- close -->
    <circle cx="1132" cy="122" r="12" fill="#2b2b2b" stroke="#FFFFFF" stroke-opacity="0.25"/>
    <path d="M1127 117 l10 10 M1137 117 l-10 10" stroke="#dfdfdf" stroke-width="1.8"/>

    <!-- ============ right column: fidelity readouts ============ -->
    <text x="816" y="152" font-size="13" font-weight="bold" fill="#ffffff">Fidelity report</text>
    <text x="816" y="168" font-size="10" font-style="italic" fill="#777">vs SOURCE sunset_042.jpg · shared/analysis engine (same SSIM as Image Compare)</text>

    <!-- SSIM row -->
    <text x="816" y="196" font-size="11.5" fill="#dfdfdf">SSIM vs source</text>
    <text x="1116" y="196" font-size="11.5" fill="#3fbf5f">0.94 · #1 of 4</text>
    <rect x="816" y="202" width="296" height="6" rx="3" fill="#4a4a4a"/>
    <rect x="816" y="202" width="278" height="6" rx="3" fill="#3fbf5f"/>
    <text x="816" y="222" font-size="9.5" fill="#777777">#2 scores 0.91 · rejected tail ≤ 0.83</text>

    <!-- detail gain dual scale -->
    <text x="816" y="248" font-size="11.5" fill="#dfdfdf">Detail gain (HF ratio)</text>
    <text x="1116" y="248" font-size="11.5" fill="#3fbf5f">+18% plausible</text>
    <rect x="816" y="254" width="296" height="6" rx="3" fill="#262626"/>
    <!-- restored..invented axis: marker position leans restored side -->
    <rect x="816" y="254" width="120" height="6" rx="3" fill="#3fbf5f" fill-opacity="0.55"/>
    <rect x="1012" y="254" width="100" height="6" rx="3" fill="#D93025" fill-opacity="0.45"/>
    <circle cx="936" cy="257" r="5" fill="#ffffff"/>
    <text x="816" y="274" font-size="9.5" fill="#3fbf5f">restored texture</text>
    <text x="1112" y="274" font-size="9.5" fill="#c0392b" text-anchor="end">invented / hallucinated</text>

    <!-- delta E color shift -->
    <text x="816" y="300" font-size="11.5" fill="#dfdfdf">Color shift ΔE</text>
    <text x="1116" y="300" font-size="11.5" fill="#3fbf5f">1.8 · imperceptible</text>
    <rect x="816" y="306" width="296" height="6" rx="3" fill="#4a4a4a"/>
    <rect x="816" y="306" width="52" height="6" rx="3" fill="#3fbf5f"/>

    <!-- banding histogram -->
    <text x="816" y="332" font-size="11.5" fill="#dfdfdf">Banding</text>
    <text x="1116" y="332" font-size="11.5" fill="#e8b64c">mild · sky region</text>
    <g>
      <rect x="816" y="340" width="296" height="56" rx="6" fill="#262626"/>
      <!-- smooth base curve + comb spikes = banding signature -->
      <g fill="#5a5a5a">
        <rect x="824" y="372" width="9" height="18"/>
        <rect x="838" y="366" width="9" height="24"/>
        <rect x="852" y="360" width="9" height="30"/>
        <rect x="866" y="356" width="9" height="34"/>
        <rect x="880" y="354" width="9" height="36"/>
        <rect x="894" y="356" width="9" height="34"/>
        <rect x="908" y="360" width="9" height="30"/>
        <rect x="922" y="366" width="9" height="24"/>
        <rect x="936" y="372" width="9" height="18"/>
      </g>
      <g fill="#e8b64c">
        <rect x="954" y="350" width="9" height="40"/>
        <rect x="978" y="346" width="9" height="44"/>
        <rect x="1002" y="352" width="9" height="38"/>
        <rect x="1026" y="358" width="9" height="32"/>
      </g>
      <g fill="#D93025">
        <rect x="1050" y="344" width="9" height="46"/>
        <rect x="1074" y="340" width="9" height="50"/>
        <rect x="1098" y="348" width="9" height="42"/>
      </g>
      <text x="964" y="408" font-size="9" fill="#777777">gradient histogram — comb spikes = banding steps (sky)</text>
    </g>

    <!-- halo row -->
    <text x="816" y="436" font-size="11.5" fill="#dfdfdf">Halo / overshoot</text>
    <text x="1116" y="436" font-size="11.5" fill="#3fbf5f">clean edges</text>
    <rect x="816" y="442" width="296" height="6" rx="3" fill="#4a4a4a"/>
    <rect x="816" y="442" width="44" height="6" rx="3" fill="#3fbf5f"/>

    <!-- series context -->
    <line x1="816" y1="462" x2="1112" y2="462" stroke="#4f4f4f"/>
    <text x="816" y="486" font-size="13" font-weight="bold" fill="#ffffff">Series 1 · sunset_042</text>
    <text x="816" y="504" font-size="11.5" fill="#9a9a9a">4 upscales of one source · rank by fidelity · 1 rejected</text>

    <g>
      <clipPath id="s0"><rect x="816" y="516" width="66" height="44" rx="6"/></clipPath>
      <rect x="816" y="516" width="66" height="44" clip-path="url(#s0)" fill="#5c4630"/>
      <rect x="816" y="516" width="66" height="44" fill="none" stroke="#e8b64c" stroke-width="1.5"/>
      <text x="888" y="530" font-size="10" fill="#e8b64c">SOURCE</text>
    </g>
    <g>
      <clipPath id="s1"><rect x="892" y="516" width="66" height="44" rx="6"/></clipPath>
      <rect x="892" y="516" width="66" height="44" clip-path="url(#s1)" fill="#6f5436"/>
      <rect x="892" y="516" width="66" height="44" fill="none" stroke="#0096FF" stroke-width="2"/>
      <text x="964" y="530" font-size="10" fill="#dfdfdf">#1 viewing</text>
    </g>
    <g>
      <clipPath id="s2"><rect x="968" y="516" width="66" height="44" rx="6"/></clipPath>
      <rect x="968" y="516" width="66" height="44" clip-path="url(#s2)" fill="#6a4e34" opacity="0.85"/>
      <text x="1040" y="530" font-size="10" fill="#dfdfdf">#2</text>
      <text x="968" y="574" font-size="10" font-style="italic" fill="#777">tie-break pending</text>
    </g>
    <g>
      <clipPath id="s3"><rect x="1044" y="516" width="66" height="44" rx="6"/></clipPath>
      <rect x="1044" y="516" width="66" height="44" clip-path="url(#s3)" fill="#5c4630" opacity="0.4"/>
      <text x="1116" y="530" font-size="10" fill="#dfdfdf">✕</text>
      <text x="1044" y="588" font-size="10" font-style="italic" fill="#777">click thumb = switch preview</text>
    </g>

    <!-- compare brief teaser -->
    <line x1="816" y1="600" x2="1112" y2="600" stroke="#4f4f4f"/>
    <text x="816" y="620" font-size="11.5" fill="#dfdfdf">vs #2: <tspan fill="#9a9a9a">this one keeps ridge detail without inventing foliage;</tspan></text>
    <text x="816" y="636" font-size="11.5" fill="#9a9a9a">#2 oversmoothed leaves (HF −31%) and shows stronger sky banding</text>

    <!-- bottom action bar of panel -->
    <line x1="120" y1="648" x2="1160" y2="648" stroke="#4f4f4f"/>
    <g>
      <rect x="144" y="664" width="150" height="36" rx="8" fill="#0096FF" fill-opacity="0.2" stroke="#0096FF" stroke-opacity="0.6"/>
      <path d="M162 676 v12 m-5 -6 l5 -6 5 6" stroke="#0096FF" stroke-width="1.8" fill="none"/>
      <path d="M178 682 h22 m-6 -6 l6 6 -6 6" stroke="#0096FF" stroke-width="1.8" fill="none"/>
      <text x="208" y="687" font-size="12" fill="#7fc4ff">Compare →</text>
    </g>
    <g>
      <rect x="306" y="664" width="150" height="36" rx="8" fill="none" stroke="#FFFFFF" stroke-opacity="0.2"/>
      <text x="324" y="687" font-size="12" fill="#dfdfdf">Add to Multi Compare</text>
    </g>
    <g>
      <rect x="468" y="664" width="110" height="36" rx="8" fill="none" stroke="#D93025" stroke-opacity="0.6"/>
      <text x="492" y="687" font-size="12" fill="#D93025">✕ Reject</text>
    </g>
    <g>
      <rect x="590" y="664" width="120" height="36" rx="8" fill="none" stroke="#e8b64c" stroke-opacity="0.6"/>
      <text x="606" y="687" font-size="12" fill="#e8b64c">Set as source</text>
    </g>
    <text x="1136" y="687" font-size="11" fill="#777777" text-anchor="end">Esc closes · ←→ walk series</text>
  </g>

  <text x="24" y="852" font-size="11" font-style="italic" fill="#8a8a8a">mode auto-selected: hub detection found smallest-resolution centroid (960×540) similar to all members → Fidelity metrics via shared/analysis (SSIM/PSNR/diff reuse) · camera metrics (sharpness/exposure/noise/WB) apply only when no source hub exists · "Set as source" overrides hub choice manually</text>
</svg>
