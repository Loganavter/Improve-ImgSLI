[mypy]
python_version = 3.11
mypy_path = src
files = src
follow_imports = skip
warn_unused_ignores = True
warn_redundant_casts = True
warn_return_any = False
check_untyped_defs = False
show_error_codes = True

# Keep real stubs for third-party packages (skip would degrade them to Any).
[mypy-PySide6.*]
follow_imports = normal

[mypy-shiboken6]
follow_imports = normal

[mypy-PIL]
follow_imports = normal

[mypy-numpy]
follow_imports = normal

[mypy-pyvips]
follow_imports = normal

# Windows-only registry/shell code: on Linux typeshed stubs winreg/ctypes
# as empty modules, so every attribute access is a false positive here.
[mypy-src.services.system.windows_file_association]
disable_error_code = attr-defined
