[pytest]
# The gate must be REPRODUCIBLE: pytest-randomly (requirements-dev.txt) shuffles
# the order on every run, so the same tree produced a different failure SET
# each time (measured 2026-10-21: 6/5/1 failures in three runs). The seed is
# pinned; randomization itself stays on, so order bugs still surface - the same
# ones, every time.
# SERIAL by default, deliberately (corrected 2026-10-28 within the hour):
# '-n 4 --dist loadfile' was made the default on the strength of two scopes measured
# stable (contracts 185->66 s, gallery 196->56 s, identical sets), and the FULL tier
# then showed five cross-file leaks that only a multi-worker run exposes:
#   test_control_discovery.py (two pre-rename fallbacks), test_mcp_live_attach.py
#   (pre-rename data dir), test_stall_watch.py (a real GUI block), and
#   test_dialog_title_bar_nav.py (Help title bar) — all green alone AND green in one
#   serial process together. A gate that flakes is worse than a slower gate: the
#   pinned seed below only means anything when one process takes one order.
# The parallel run is documented and measured per scope in docs/dev/TESTING.md § 3a;
# it is the FAST mode, not the merge gate, until those leaks are fixed.
# '--timeout' stays: a hang guard is order-neutral and a wedged Qt test used to eat
# the whole run.
addopts = --randomly-seed=20261021 --timeout=300
markers =
    slow: whole-tree contract scans (20+s); deselect for the fast tier with -m "not slow", run in full/nightly
    flaky: known timing-sensitive; quarantine list in docs/dev/TESTING.md
    # Tier markers. Assigned mechanically from the file path by the ROOT
    # conftest.py `pytest_collection_modifyitems` (table `TIER_MARKERS`), not by
    # per-file `pytestmark` — a new test inherits its tier from its folder.
    # Policy (which tier to run when): docs/dev/TESTING.md § Tiers.
    contracts: everything under tests/contracts/ (AST/architecture dogmas)
    devtools: everything under tests/devtools/ (docs graph, UI inspector, MCP/control surface)
    plugins: everything under tests/plugins/ (app-wide plugin behavior)
    runtime: everything under tests/runtime/ (registry, event bus, Feature State API)
    render: everything under tests/render/ (shared render-plan behavior, fake context)
    ui: everything under tests/ui/ (dialog layer)
    video: everything under tests/video/ (remnant timeline-handle module)
    target_bug: everything under tests/target_bug/ (single regression module)
    tabs: src/tabs/**/tests/** (all per-tab suites)
# Segfault attribution (CI): dump the Python stack when the Qt event loop
# dies under xdist (pytestqt _process_events) or a test stalls. Print-only —
# never fails a run. 120 s stays above the slowest known scan (~64 s).
faulthandler_timeout = 120
