name: Tests

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  fast:
    name: Fast tier (not slow)
    runs-on: ubuntu-latest
    # Required since F8 (task-ci-suite-hardening-2026-09-22): 3 consecutive
    # green fast-tier runs on CI (2772 passed x3, runs 35735535521 attempts
    # 1-3). Suite is hardened for enforcement.
    steps:
      - name: Check Out App
        uses: actions/checkout@v4
        with:
          path: app

      - name: Check Out Toolkit Sibling
        uses: actions/checkout@v4
        with:
          repository: Loganavter/sli-ui-toolkit-private
          token: ${{ secrets.TOOLKIT_PAT }}
          path: sli-ui-toolkit

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Translation Gate (parity + code keys)
        # Every locale must carry every key, and every literal tr()/_tr() key in
        # the app (plus the sibling toolkit, checked out above) must exist in a
        # catalog. Parity alone once stayed green while a widget asked for a key
        # no catalog defined (the half-translated switch, 2026-10-22).
        run: python app/src/devtools/check_translations.py --strict --code-keys

      - name: Install System Libraries
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 libfontconfig1 libdbus-1-3

      - name: Cache Pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-tests-${{ hashFiles('app/requirements-gui.txt', 'app/requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-tests-
            ${{ runner.os }}-pip-

      - name: Install Python Dependencies
        working-directory: app
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-gui.txt
          pip install -r requirements-dev.txt

      - name: Run Fast Tier
        working-directory: app
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONDONTWRITEBYTECODE: 1
        run: |
          python -m pytest tests -m "not slow" -n auto -q -p no:cacheprovider --durations=10

  comment-citations:
    name: Comment citations (stale/ambiguous)
    runs-on: ubuntu-latest
    # Unoutdated-comment gate: an outdated comment is a correctness defect
    # (agents execute prose as truth). Stdlib-only checker; the app+toolkit
    # sibling layout matches the fast job so `--extra-root` resolves.
    steps:
      - name: Check Out App
        uses: actions/checkout@v4
        with:
          path: app

      - name: Check Out Toolkit Sibling
        uses: actions/checkout@v4
        with:
          repository: Loganavter/sli-ui-toolkit-private
          token: ${{ secrets.TOOLKIT_PAT }}
          path: sli-ui-toolkit

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check comment/docstring citations
        working-directory: app
        run: |
          # Fails (exit 1) on NEW dangling path:line / symbol / id citations.
          # `scripts/comment_citations_allow.txt` is the ratchet for accepted
          # external/runtime names. Never invent a citation to satisfy it.
          python scripts/check_comment_citations.py \
            --extra-root ../sli-ui-toolkit/src \
            --allow scripts/comment_citations_allow.txt

  full:
    name: Full suite (nightly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Check Out App
        uses: actions/checkout@v4
        with:
          path: app

      - name: Check Out Toolkit Sibling
        uses: actions/checkout@v4
        with:
          repository: Loganavter/sli-ui-toolkit-private
          token: ${{ secrets.TOOLKIT_PAT }}
          path: sli-ui-toolkit

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install System Libraries
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 libfontconfig1 libdbus-1-3

      - name: Cache Pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-tests-${{ hashFiles('app/requirements-gui.txt', 'app/requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-tests-
            ${{ runner.os }}-pip-

      - name: Install Python Dependencies
        working-directory: app
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-gui.txt
          pip install -r requirements-dev.txt

      - name: Run Full Suite
        working-directory: app
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONDONTWRITEBYTECODE: 1
        run: |
          # Bare pytest: top-level tests/ AND src/tabs/*/tests/ (TESTING.md).
          # The `tests`-only path silently skipped 1484 tab tests. Stays
          # informative (continue-on-error) until the 8 pre-existing tab
          # reds (video preview x4, canvas-runtime dogma, MC deferred view,
          # session_picker colors x2 — never gated before, proven on main)
          # are fixed as the next hardening wave.
          python -m pytest -n auto -q -p no:cacheprovider --durations=15
