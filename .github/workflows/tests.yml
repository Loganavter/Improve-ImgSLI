name: Tests

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  fast:
    name: Fast tier (not slow)
    runs-on: ubuntu-latest
    steps:
      - name: Check Out App
        uses: actions/checkout@v4
        with:
          path: app

      - name: Check Out Toolkit Sibling
        uses: actions/checkout@v4
        with:
          repository: Loganavter/sli-ui-toolkit
          path: sli-ui-toolkit

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Cache Pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-tests-${{ hashFiles('app/requirements-gui.txt', 'app/requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-tests-
            ${{ runner.os }}-pip-

      - name: Install Python Dependencies
        working-directory: app
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-gui.txt
          pip install -r requirements-dev.txt

      - name: Run Fast Tier
        working-directory: app
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONDONTWRITEBYTECODE: 1
        run: |
          python -m pytest tests -m "not slow" -n auto -q -p no:cacheprovider --durations=10

  full:
    name: Full suite (nightly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check Out App
        uses: actions/checkout@v4
        with:
          path: app

      - name: Check Out Toolkit Sibling
        uses: actions/checkout@v4
        with:
          repository: Loganavter/sli-ui-toolkit
          path: sli-ui-toolkit

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Cache Pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-tests-${{ hashFiles('app/requirements-gui.txt', 'app/requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-tests-
            ${{ runner.os }}-pip-

      - name: Install Python Dependencies
        working-directory: app
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-gui.txt
          pip install -r requirements-dev.txt

      - name: Run Full Suite
        working-directory: app
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONDONTWRITEBYTECODE: 1
        run: |
          python -m pytest tests -n auto -q -p no:cacheprovider --durations=15
